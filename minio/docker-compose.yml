services:
  minio:
    image: minio/minio:latest
    container_name: minio
    network_mode: host
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${minio_root_user}
      MINIO_ROOT_PASSWORD: ${minio_root_pass}
    volumes:
      - ./data:/data
    command: server /data --console-address ":9001"
